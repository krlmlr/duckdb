# Function documentation; source of truth for the sibling functions.json
# (regenerate with: python3 scripts/functions_yaml.py to-json).
- name: '@'
  parameters: x
  description: Absolute value
  examples:
    - abs(-17.4)
  type: scalar_function_set
  struct: AbsOperatorFun
  aliases:
    - abs
- name: '**'
  parameters: x,y
  description: Computes x to the power of y
  examples:
    - pow(2, 3)
    - power(2, 3)
    - 2 ** 3
    - 2 ^ 3
  type: scalar_function
  struct: PowOperatorFun
  aliases:
    - pow
    - power
    - ^
- name: '!__postfix'
  parameters: x
  description: Factorial of x. Computes the product of the current integer and all integers
    below it
  examples:
    - 4!
  type: scalar_function
  struct: FactorialOperatorFun
  aliases:
    - factorial
- name: acos
  parameters: x
  description: Computes the arccosine of x
  examples:
    - acos(0.5)
  type: scalar_function
- name: asin
  parameters: x
  description: Computes the arcsine of x
  examples:
    - asin(0.5)
  type: scalar_function
- name: atan
  parameters: x
  description: Computes the arctangent of x
  examples:
    - atan(0.5)
  type: scalar_function
- name: atan2
  parameters: y,x
  description: Computes the arctangent (y, x)
  examples:
    - atan2(1.0, 0.0)
  type: scalar_function
- name: binom
  parameters: n,k
  description: Returns binom(n,k)
  examples:
    - binom(5,2)
  type: scalar_function
- name: bit_count
  parameters: x
  description: Returns the number of bits that are set
  examples:
    - bit_count(31)
  type: scalar_function_set
- name: cbrt
  parameters: x
  description: Returns the cube root of x
  examples:
    - cbrt(8)
  type: scalar_function
- name: ceil
  parameters: x
  description: Rounds the number up
  examples:
    - ceil(17.4)
  type: scalar_function_set
  aliases:
    - ceiling
- name: cos
  parameters: x
  description: Computes the cos of x
  examples:
    - cos(90)
  type: scalar_function
- name: cot
  parameters: x
  description: Computes the cotangent of x
  examples:
    - cot(0.5)
  type: scalar_function
- name: degrees
  parameters: x
  description: Converts radians to degrees
  examples:
    - degrees(pi())
  type: scalar_function
- name: even
  parameters: x
  description: Rounds x to next even number by rounding away from zero
  examples:
    - even(2.9)
  type: scalar_function
- name: exp
  parameters: x
  description: Computes e to the power of x
  examples:
    - exp(1)
  type: scalar_function
- name: floor
  parameters: x
  description: Rounds the number down
  examples:
    - floor(17.4)
  type: scalar_function_set
- name: isfinite
  parameters: x
  description: Returns true if the floating point value is finite, false otherwise
  examples:
    - isfinite(5.5)
  type: scalar_function_set
  struct: IsFiniteFun
- name: isinf
  parameters: x
  description: Returns true if the floating point value is infinite, false otherwise
  examples:
    - isinf('Infinity'::float)
  type: scalar_function_set
  struct: IsInfiniteFun
- name: isnan
  parameters: x
  description: Returns true if the floating point value is not a number, false otherwise
  examples:
    - isnan('NaN'::FLOAT)
  type: scalar_function_set
  struct: IsNanFun
- name: gamma
  parameters: x
  description: Interpolation of (x-1) factorial (so decimal inputs are allowed)
  examples:
    - gamma(5.5)
  type: scalar_function
- name: greatest_common_divisor
  parameters: x,y
  description: Computes the greatest common divisor of x and y
  examples:
    - greatest_common_divisor(42, 57)
  type: scalar_function_set
  aliases:
    - gcd
- name: least_common_multiple
  parameters: x,y
  description: Computes the least common multiple of x and y
  examples:
    - least_common_multiple(42, 57)
  type: scalar_function_set
  aliases:
    - lcm
- name: lgamma
  parameters: x
  description: Computes the log of the gamma function
  examples:
    - lgamma(2)
  type: scalar_function
  struct: LogGammaFun
- name: ln
  parameters: x
  description: Computes the natural logarithm of x
  examples:
    - ln(2)
  type: scalar_function
- name: log2
  parameters: x
  description: Computes the 2-log of x
  examples:
    - log2(8)
  type: scalar_function
- name: log10
  parameters: x
  description: Computes the 10-log of x
  examples:
    - log10(1000)
  type: scalar_function
- name: log
  parameters: b, x
  description: Computes the logarithm of x to base b. b may be omitted, in which case the
    default 10
  examples:
    - log(2, 64)
  type: scalar_function_set
- name: nextafter
  parameters: x, y
  description: Returns the next floating point value after x in the direction of y
  examples:
    - nextafter(1::float, 2::float)
  type: scalar_function_set
  struct: NextAfterFun
- name: pi
  description: Returns the value of pi
  examples:
    - pi()
  type: scalar_function
- name: radians
  parameters: x
  description: Converts degrees to radians
  examples:
    - radians(90)
  type: scalar_function
- name: round
  parameters: x,precision
  description: Rounds x to s decimal places
  examples:
    - round(42.4332, 2)
  type: scalar_function_set
- name: sign
  parameters: x
  description: Returns the sign of x as -1, 0 or 1
  examples:
    - sign(-349)
  type: scalar_function_set
- name: signbit
  parameters: x
  description: Returns whether the signbit is set or not
  examples:
    - signbit(-0.0)
  type: scalar_function_set
  struct: SignBitFun
- name: sin
  parameters: x
  description: Computes the sin of x
  examples:
    - sin(90)
  type: scalar_function
- name: sqrt
  parameters: x
  description: Returns the square root of x
  examples:
    - sqrt(4)
  type: scalar_function
- name: tan
  parameters: x
  description: Computes the tan of x
  examples:
    - tan(90)
  type: scalar_function
- name: trunc
  parameters: x
  description: Truncates the number
  examples:
    - trunc(17.4)
  type: scalar_function_set
- name: cosh
  parameters: x
  description: Computes the hyperbolic cos of x
  examples:
    - cosh(1)
  type: scalar_function
- name: sinh
  parameters: x
  description: Computes the hyperbolic sin of x
  examples:
    - sinh(1)
  type: scalar_function
- name: tanh
  parameters: x
  description: Computes the hyperbolic tan of x
  examples:
    - tanh(1)
  type: scalar_function
- name: acosh
  parameters: x
  description: Computes the inverse hyperbolic cos of x
  examples:
    - acosh(2.3)
  type: scalar_function
- name: asinh
  parameters: x
  description: Computes the inverse hyperbolic sin of x
  examples:
    - asinh(0.5)
  type: scalar_function
- name: atanh
  parameters: x
  description: Computes the inverse hyperbolic tan of x
  examples:
    - atanh(0.5)
  type: scalar_function
