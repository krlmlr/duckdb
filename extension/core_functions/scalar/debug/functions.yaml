# Function documentation; source of truth for the sibling functions.json
# (regenerate with: python3 scripts/functions_yaml.py to-json).
- name: vector_type
  parameters: col
  description: Returns the VectorType of a given column
  examples:
    - vector_type(col)
  type: scalar_function
- name: sleep_ms
  parameters: milliseconds
  description: Sleeps for the specified number of milliseconds and returns NULL
  examples:
    - sleep_ms(100)
  type: scalar_function
- name: index_key
  parameters: path, name, [key_column_1, key_column_2, ...]
  description: Generate index keys for a named index on a table (specified by a path struct
    with required 'table' and optional 'catalog'/'schema' fields) from key column arguments.
    Currently only supports ART indexes.
  examples:
    - 'index_key({''schema'': ''main'', ''table'': ''tbl3''}, ''tbl3_idx'', key1, key2, key3)'
  type: scalar_function
  struct: IndexKeyFun
