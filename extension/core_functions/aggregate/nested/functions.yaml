# Function documentation; source of truth for the sibling functions.json
# (regenerate with: python3 scripts/functions_yaml.py to-json).
- name: histogram
  parameters: arg
  description: Returns a LIST of STRUCTs with the fields bucket and count.
  examples:
    - histogram(A)
  type: aggregate_function_set
  extra_functions:
    - static AggregateFunction GetHistogramUnorderedMap(LogicalType &type);
    - static AggregateFunction BinnedHistogramFunction();
- name: histogram_exact
  parameters: arg,bins
  description: Returns a LIST of STRUCTs with the fields bucket and count matching the buckets
    exactly.
  examples:
    - histogram_exact(A, [0, 1, 2])
  type: aggregate_function
- name: list
  parameters: arg
  description: Returns a LIST containing all the values of a column.
  examples:
    - list(A)
  type: aggregate_function
  aliases:
    - array_agg
