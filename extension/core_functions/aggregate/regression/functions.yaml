# Function documentation; source of truth for the sibling functions.json
# (regenerate with: python3 scripts/functions_yaml.py to-json).
- name: regr_avgx
  parameters: y,x
  description: Returns the average of the independent variable for non-NULL pairs in a group,
    where x is the independent variable and y is the dependent variable.
  examples:
    - ''
  type: aggregate_function
  struct: RegrAvgxFun
- name: regr_avgy
  parameters: y,x
  description: Returns the average of the dependent variable for non-NULL pairs in a group,
    where x is the independent variable and y is the dependent variable.
  examples:
    - ''
  type: aggregate_function
  struct: RegrAvgyFun
- name: regr_count
  parameters: y,x
  description: Returns the number of non-NULL number pairs in a group.
  examples:
    - (SUM(x*y) - SUM(x) * SUM(y) / COUNT(*)) / COUNT(*)
  type: aggregate_function
  struct: RegrCountFun
- name: regr_intercept
  parameters: y,x
  description: Returns the intercept of the univariate linear regression line for non-NULL
    pairs in a group.
  examples:
    - AVG(y)-REGR_SLOPE(y, x)*AVG(x)
  type: aggregate_function
  struct: RegrInterceptFun
- name: regr_r2
  parameters: y,x
  description: Returns the coefficient of determination for non-NULL pairs in a group.
  examples:
    - ''
  type: aggregate_function
  struct: RegrR2Fun
- name: regr_slope
  parameters: y,x
  description: Returns the slope of the linear regression line for non-NULL pairs in a group.
  examples:
    - COVAR_POP(x, y) / VAR_POP(x)
  type: aggregate_function
  struct: RegrSlopeFun
- name: regr_sxx
  parameters: y,x
  description: ''
  examples:
    - REGR_COUNT(y, x) * VAR_POP(x)
  type: aggregate_function
  struct: RegrSXXFun
- name: regr_sxy
  parameters: y,x
  description: Returns the population covariance of input values
  examples:
    - REGR_COUNT(y, x) * COVAR_POP(y, x)
  type: aggregate_function
  struct: RegrSXYFun
- name: regr_syy
  parameters: y,x
  description: ''
  examples:
    - REGR_COUNT(y, x) * VAR_POP(y)
  type: aggregate_function
  struct: RegrSYYFun
